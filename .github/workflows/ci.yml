name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: obikards_test
          POSTGRES_USER: obikards_test
          POSTGRES_PASSWORD: obikards_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obikards_test -d obikards_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/obikards_dev
      DIRECT_URL: postgresql://unused:unused@127.0.0.1:5432/obikards_dev
      TEST_DATABASE_URL: postgresql://obikards_test:obikards_test_password@127.0.0.1:5432/obikards_test
      TEST_DIRECT_URL: postgresql://obikards_test:obikards_test_password@127.0.0.1:5432/obikards_test
      AUTH_COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DIRECT_URL }}
      - run: npm run test:db:prepare
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build